<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(-45deg,#000,#071b11,#000,#0d1f16);
    background-size:400% 400%;
    animation:bgmove 12s ease infinite;
    color:white;
    text-align:center;
    overflow-x:hidden;
    min-height:100vh;
}

/* BACKGROUND ANIMATION */
@keyframes bgmove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* PARTICLES */
.particles{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    pointer-events:none;
    background-image:
    radial-gradient(#00e676 1px, transparent 1px);
    background-size:35px 35px;
    opacity:.08;
    animation:moveParticles 20s linear infinite;
}

@keyframes moveParticles{
    from{transform:translateY(0);}
    to{transform:translateY(-200px);}
}

/* TOP BAR */
.top-bar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:rgba(0,0,0,0.9);
    backdrop-filter:blur(10px);
    padding:10px 12px;
    z-index:1000;
    border-bottom:1px solid #222;
}

/* LOGO */
.logo{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
    color:#00e676;
    text-shadow:
    0 0 10px #00e676,
    0 0 20px #00e676;
}

/* MENU */
.top-menu{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
}

.top-menu a{
    font-size:12px;
    color:white;
    text-decoration:none;
    padding:8px 14px;
    background:#111;
    border:1px solid #222;
    border-radius:30px;
    transition:.3s;
}

.top-menu a:hover{
    background:#00e676;
    color:black;
    box-shadow:
    0 0 10px #00e676,
    0 0 20px #00e676,
    0 0 40px #00e676;
}

/* CONTAINER */
.container{
    padding:20px;
    margin-top:130px;
    margin-bottom:120px;
    position:relative;
    z-index:10;
}

h2{
    color:#00e676;
    margin-bottom:12px;
    text-shadow:0 0 15px #00e676;
}

/* DATE */
#dateTime{
    margin:12px 0;
    color:#00e676;
    font-weight:bold;
    font-size:15px;
}

/* BOX */
.box{
    background:rgba(17,17,17,.85);
    padding:15px;
    border-radius:18px;
    margin-bottom:15px;
    border:1px solid #222;
    box-shadow:0 0 15px rgba(0,255,100,.08);
    backdrop-filter:blur(5px);
}

/* VIDEO */
video{
    width:100%;
    max-width:420px;
    border-radius:18px;
    margin-top:10px;
    border:2px solid #222;
    box-shadow:0 0 20px rgba(0,255,100,.15);
}

/* STATUS */
#statusText{
    margin-top:14px;
    color:#ddd;
    font-size:15px;
    min-height:24px;
}

/* PROGRESS */
#progressContainer{
    width:90%;
    max-width:320px;
    height:14px;
    background:rgba(255,255,255,0.08);
    border-radius:50px;
    margin:18px auto;
    overflow:hidden;
    border:1px solid #222;
}

#progressBar{
    width:0%;
    height:100%;
    background:linear-gradient(to right,#00e676,#00c853);
    border-radius:50px;
    position:relative;
    overflow:hidden;
    transition:.5s;
}

#progressBar::after{
    content:'';
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:rgba(255,255,255,.3);
    animation:shine 1.5s infinite;
}

@keyframes shine{
    to{
        left:100%;
    }
}

/* ADS */
.ad-box{
    margin-top:20px;
    background:rgba(17,17,17,.85);
    border:1px solid #222;
    border-radius:18px;
    padding:15px;
    box-shadow:0 0 15px rgba(0,255,100,.08);
}

.ad-title{
    color:#00e676;
    margin-bottom:10px;
    font-weight:bold;
    font-size:18px;
}

/* BUTTON AREA */
.bottom-buttons{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    padding:15px;
    background:rgba(0,0,0,.95);
    border-top:1px solid #222;
    z-index:1000;
}

/* BUTTON */
button{
    width:100%;
    padding:17px;
    border:none;
    border-radius:50px;
    font-size:18px;
    font-weight:bold;
    background:linear-gradient(to right,#00e676,#00c853);
    color:black;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 0 20px rgba(0,255,100,.4);
    animation:pulse 1.5s infinite;
}

button:hover{
    transform:scale(1.02);
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

@keyframes pulse{
    0%{
        box-shadow:0 0 0 0 rgba(0,255,100,.6);
    }
    70%{
        box-shadow:0 0 0 18px rgba(0,255,100,0);
    }
    100%{
        box-shadow:0 0 0 0 rgba(0,255,100,0);
    }
}

/* FOOTER */
.footer{
    margin-top:20px;
    font-size:12px;
    color:#777;
}

</style>

<body>

<!-- PARTICLES -->
<div class="particles"></div>

    <div class="top-menu">
        <a href="index.html">Home</a>
        <a href="vision.html">Vision</a>
        <a href="chat.html">Chat</a>
        <a href="games.html">Games</a>
        <a href="booking.html">Booking</a>
    </div>

</div>

<!-- CONTENT -->
<div class="container">

<h2>🎮 Welcome to Renson WiFi</h2>

<div id="dateTime"></div>

<div class="box">
☀️ Weather: Sunny • 31°C
</div>

<video autoplay muted loop playsinline>
<source src="ad.mp4" type="video/mp4">
</video>

<p id="statusText">
Initializing system...
</p>

<div id="progressContainer">
<div id="progressBar"></div>
</div>

<!-- ADS -->
<div class="ad-box">

<div class="ad-title">
📢 Sponsored Ads
</div>

<p>
🔥 Watch ads and enjoy faster internet access.
</p>

</div>

<div class="footer">
Powered by Renson EcoFarm Services
</div>

</div>

<!-- BUTTON -->
<div class="bottom-buttons">
<button id="connectBtn" disabled onclick="connectNet()">
CONNECT INTERNET
</button>
</div>

<!-- MUSIC -->
<audio id="bgmusic" loop>
<source src="music.mp3" type="audio/mp3">
</audio>

<!-- CLICK SOUND -->
<audio id="clickSound">
<source src="click.mp3" type="audio/mp3">
</audio>

<script>

/* ELEMENTS */
let t = 10;

let bar = document.getElementById("progressBar");
let txt = document.getElementById("statusText");
let btn = document.getElementById("connectBtn");

/* STATUS MESSAGES */
let msgs = [
"📡 Scanning nearby network...",
"🔐 Securing connection...",
"⚡ Optimizing internet speed...",
"📺 Loading sponsored ads...",
"🌐 Preparing hotspot access..."
];

let msgIndex = 0;

/* MESSAGE ROTATOR */
let msgTimer = setInterval(()=>{

    if(t > 0){
        txt.innerText = msgs[msgIndex];
        msgIndex = (msgIndex + 1) % msgs.length;
    }

},2000);

/* PROGRESS TIMER */
let timer = setInterval(()=>{

    t--;

    bar.style.width = ((10 - t) * 10) + "%";

    if(t <= 0){

        clearInterval(timer);

        clearInterval(msgTimer);

        txt.innerText = "✅ Tap CONNECT to continue";

        btn.disabled = false;

    }

},1000);

/* DATE & TIME */
setInterval(()=>{

    let d = new Date();

    document.getElementById("dateTime").innerHTML =
    "📅 " + d.toLocaleDateString() +
    "<br>🕒 " + d.toLocaleTimeString();

},1000);

/* MUSIC AUTOPLAY */
document.body.addEventListener("click",()=>{

    let m = document.getElementById("bgmusic");

    m.volume = 0.2;

    m.play().catch(()=>{});

},{once:true});

/* CONNECT */
function connectNet(){

    document.getElementById("clickSound").play();

    btn.innerText = "CONNECTING...";
    btn.disabled = true;

    txt.innerText = "🚀 Connecting to hotspot...";

    setTimeout(()=>{

        window.location.href =
        "http://192.168.22.1/login2.html";

    },5000);

}

</script>

</body>
