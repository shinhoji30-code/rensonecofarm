<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(to bottom,#000,#111);
    color:white;
    text-align:center;
    overflow-x:hidden;

/* TOP BAR */
.top-bar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:rgba(0,0,0,0.95);
    backdrop-filter:blur(10px);
    padding:10px 12px;
    z-index:1000;
    box-sizing:border-box;

/* LOGO */

.top-menu a{

    padding:7px 12px;
    background:#111;
    border:1px solid #222;
    border-radius:20px;
    transition:.3s;
}

.top-menu a:hover{
    background:#00c853;
    color:black;
    box-shadow:0 0 15px #00e676;
}

/* CONTENT */
.container{
    padding:20px;
    margin-top:120px;
    margin-bottom:110px;
}

h2{
    margin-bottom:10px;
    color:#00e676;
}

/* DATE */
#dateTime{
    margin:12px 0;
    color:#00e676;
    font-weight:bold;
    font-size:15px;
}

/* BOX */
.box{
    background:#111;
    padding:14px;
    border-radius:14px;
    margin-bottom:15px;
    border:1px solid #222;
    text-align:left;
    box-shadow:0 0 10px rgba(0,255,100,.08);
}

/* VIDEO */
video{
    width:100%;
    max-width:420px;
    border-radius:14px;
    margin-top:10px;
    border:2px solid #222;
}

/* STATUS */
#statusText{
    margin-top:14px;
    color:#ddd;
    font-size:15px;
}

/* PROGRESS */
#progressContainer{
    width:90%;
    max-width:320px;
    height:12px;
    background:rgba(255,255,255,0.08);
    border-radius:50px;
    margin:15px auto;
    overflow:hidden;
}

#progressBar{
    width:0%;
    height:100%;
    background:linear-gradient(to right,#00e676,#00c853);
    border-radius:50px;
    transition:.4s;

/* BUTTON */
button{

    border-radius:50px;
    font-size:18px;
    font-weight:bold;
    background:linear-gradient(to right,#00e676,#00c853);

    cursor:pointer;
    transition:.3s;
    box-shadow:0 0 20px rgba(0,255,100,.4);
}

button:hover{

button:disabled{

<!-- CONTENT -->

<h2>🎮 Welcome to Renson WiFi</h2>

<div id="dateTime"></div>

<div class="box">
☀️ Weather: Sunny • 31°C
</div>

<video autoplay muted loop playsinline>
<source src="ad.mp4" type="video/mp4">
</video>

<p id="statusText">
Watch ads to continue internet access
</p>

<div id="progressBar"></div>

<button id="connectBtn" disabled onclick="connectNet()">
CONNECT INTERNET
</button>
</div>

<!-- MUSIC -->
<audio id="bgmusic" loop>
<source src="music.mp3" type="audio/mp3">
</audio>

<script>

/* TIMER */
let t = 10;

let bar = document.getElementById("progressBar");
let txt = document.getElementById("statusText");
let btn = document.getElementById("connectBtn");

let timer = setInterval(()=>{

    t--;

    bar.style.width = ((10 - t) * 10) + "%";

    txt.innerText = "Please wait " + t + "s";

    if(t <= 0){

        clearInterval(timer);

        txt.innerText = "Tap CONNECT to continue";

        btn.disabled = false;

    }

},1000);

/* DATE & TIME */
setInterval(()=>{

    let d = new Date();

    document.getElementById("dateTime").innerHTML =
    "📅 " + d.toLocaleDateString() +
    "<br>🕒 " + d.toLocaleTimeString();

},1000);

/* MUSIC AUTOPLAY */
document.body.addEventListener("click",()=>{

    let m = document.getElementById("bgmusic");

    m.volume = 0.2;

    m.play().catch(()=>{});

},{once:true});

/* CONNECT */
function connectNet(){

    btn.innerText = "CONNECTING...";
    btn.disabled = true;

    txt.innerText = "Please wait...";

    setTimeout(()=>{

        window.location.href =
        "http://192.168.22.1/login2.html";

    },5000);

}

</script>

</body>
