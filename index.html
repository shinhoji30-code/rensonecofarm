
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RENSON WiFiHUB - Internet Access Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(-45deg,#000,#071b11,#000,#0d1f16);
    background-size:400% 400%;
    animation:bgmove 12s ease infinite;
    color:white;
    text-align:center;
    overflow-x:hidden;
    min-height:100vh;
}

@keyframes bgmove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* PARTICLES */
.particles{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    pointer-events:none;
    background-image:radial-gradient(#00e676 1px,transparent 1px);
    background-size:35px 35px;
    opacity:.08;
    animation:moveParticles 20s linear infinite;
}

@keyframes moveParticles{
    from{transform:translateY(0);}
    to{transform:translateY(-200px);}
}

/* HEADER */
.top-bar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:rgba(0,0,0,.95);
    backdrop-filter:blur(10px);
    padding:12px;
    z-index:1000;
    border-bottom:1px solid #222;
}

.logo{
    font-size:23px;
    font-weight:bold;
    margin-bottom:10px;
    color:#00e676;
    text-shadow:0 0 10px #00e676,0 0 20px #00e676;
}

/* MENU */
.top-menu{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
}

.top-menu a{
    font-size:12px;
    color:white;
    text-decoration:none;
    padding:8px 14px;
    background:#111;
    border:1px solid #222;
    border-radius:30px;
    transition:.3s;
}

.top-menu a:hover{
    background:#00e676;
    color:black;
}

/* MAIN */
.container{
    padding:20px;
    margin-top:145px;
    margin-bottom:110px;
    position:relative;
    z-index:10;
}

h2{
    color:#00e676;
    margin-bottom:12px;
    text-shadow:0 0 15px #00e676;
}

#dateTime{
    margin:12px 0;
    color:#00e676;
    font-weight:bold;
    font-size:15px;
}

/* BOX */
.box{
    background:rgba(17,17,17,.85);
    padding:18px;
    border-radius:18px;
    margin-bottom:15px;
    border:1px solid #222;
    box-shadow:0 0 15px rgba(0,255,100,.08);
    backdrop-filter:blur(5px);
}

/* BARANGAY */
.barangay-title{
    color:#00e676;
    font-size:19px;
    font-weight:bold;
    margin-bottom:8px;
}

.barangay-subtitle{
    color:#bbb;
    font-size:13px;
    margin-bottom:18px;
}

.barangay-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.barangay-btn{
    padding:20px 8px;
    background:linear-gradient(145deg,#102b1b,#06150c);
    border:2px solid #245b38;
    border-radius:16px;
    color:white;
    cursor:pointer;
    transition:.3s;
}

.barangay-btn .icon{
    font-size:32px;
    display:block;
    margin-bottom:10px;
}

.barangay-btn strong{
    display:block;
    font-size:14px;
}

.barangay-btn.selected{
    background:linear-gradient(to right,#00e676,#00c853);
    border-color:#00e676;
    color:black;
    box-shadow:0 0 20px rgba(0,230,118,.5);
}

.barangay-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* VIDEO */
video{
    width:100%;
    max-width:420px;
    border-radius:18px;
    margin-top:10px;
    border:2px solid #222;
    box-shadow:0 0 20px rgba(0,255,100,.15);
}

/* STATUS */
#statusText{
    margin-top:14px;
    color:#ddd;
    font-size:15px;
    min-height:24px;
}

/* PROGRESS */
#progressContainer{
    width:90%;
    max-width:320px;
    height:14px;
    background:rgba(255,255,255,.08);
    border-radius:50px;
    margin:18px auto;
    overflow:hidden;
    border:1px solid #222;
}

#progressBar{
    width:0%;
    height:100%;
    background:linear-gradient(to right,#00e676,#00c853);
    border-radius:50px;
    transition:.5s;
}

/* FOOTER */
.footer{
    margin-top:20px;
    font-size:12px;
    color:#777;
}

/* BOTTOM BUTTON */
.bottom-buttons{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    padding:15px;
    background:rgba(0,0,0,.95);
    border-top:1px solid #222;
    z-index:1000;
}

#connectBtn{
    width:100%;
    padding:17px;
    border:none;
    border-radius:50px;
    font-size:18px;
    font-weight:bold;
    background:linear-gradient(to right,#00e676,#00c853);
    color:black;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 0 20px rgba(0,255,100,.4);
    animation:pulse 1.5s infinite;
}

#connectBtn:disabled{
    opacity:.4;
    cursor:not-allowed;
    animation:none;
}

@keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(0,255,100,.6);}
    70%{box-shadow:0 0 0 18px rgba(0,255,100,0);}
    100%{box-shadow:0 0 0 0 rgba(0,255,100,0);}
}

@media(max-width:400px){
    .logo{font-size:20px;}
    .container{margin-top:150px;}
    .barangay-btn{padding:16px 5px;}
}
</style>
</head>

<body>

<div class="particles"></div>

<!-- HEADER -->
<div class="top-bar">

    <div class="logo">🌿 RENSON WiFiHUB</div>

    <div class="top-menu">
        <a href="index.html">Home</a>
        <a href="vision.html">Vision</a>
        <a href="chat.html">Chat</a>
        <a href="games.html">Games</a>
        <a href="booking.html">Booking</a>
    </div>

</div>

<!-- CONTENT -->
<div class="container">

<h2>🌐 Welcome to RENSON WiFiHUB</h2>

<div id="dateTime"></div>

<!-- BARANGAY SELECTION -->
<div class="box">

    <div class="barangay-title">
        📍 SELECT YOUR BARANGAY
    </div>

    <div class="barangay-subtitle">
        Piliin ang inyong barangay para magpatuloy.
    </div>

    <div class="barangay-options">

        <button type="button"
        class="barangay-btn"
        id="concepcionBtn"
        onclick="selectBarangay('concepcion')">

            <span class="icon">🏡</span>
            <strong>BRGY. CONCEPCION</strong>

        </button>

        <button type="button"
        class="barangay-btn"
        id="bigajoBtn"
        onclick="selectBarangay('bigajo')">

            <span class="icon">🏡</span>
            <strong>BRGY. BIGAJO</strong>

        </button>

    </div>

    <p id="selectedBarangay"
    style="margin-top:15px;color:#00e676;font-weight:bold;">
        No barangay selected
    </p>

</div>

<!-- OPTIONAL VIDEO -->
<div class="box">

    <h3 style="color:#00e676;">🌿 Welcome to Renson WiFiHUB</h3>

    <video autoplay muted loop playsinline>
        <source src="ad.mp4" type="video/mp4">
    </video>

</div>

<p id="statusText">
Please select your barangay to continue.
</p>

<div id="progressContainer">
    <div id="progressBar"></div>
</div>

<div class="footer">
    Powered by Renson EcoFarm Services
</div>

</div>

<!-- CONNECT BUTTON -->
<div class="bottom-buttons">

    <button type="button" id="connectBtn" disabled
    onclick="connectNet()">
        SELECT BARANGAY FIRST
    </button>

</div>

<!-- MUSIC -->
<audio id="bgmusic" loop>
    <source src="music.mp3" type="audio/mp3">
</audio>

<!-- CLICK SOUND -->
<audio id="clickSound">
    <source src="click.mp3" type="audio/mp3">
</audio>

<script>

/* MIKROTIK PORTAL CONFIGURATION */
const portals = {

    concepcion: "http://192.168.22.1/login2.html",

    bigajo: "http://192.168.22.1/login3.html"

};

/* ELEMENTS */
let t = 10;
let selected = "";
let timer = null;
let msgTimer = null;
let countdownStarted = false;

const bar = document.getElementById("progressBar");
const txt = document.getElementById("statusText");
const btn = document.getElementById("connectBtn");

const concepcionBtn = document.getElementById("concepcionBtn");
const bigajoBtn = document.getElementById("bigajoBtn");

/* STATUS MESSAGES */
const msgs = [
    "📡 Scanning nearby network...",
    "🔐 Securing connection...",
    "⚡ Preparing internet access...",
    "🌐 Checking network connection...",
    "🚀 Getting your hotspot ready..."
];

/* SELECT BARANGAY */
function selectBarangay(place){

    if(countdownStarted) return;

    selected = place;

    concepcionBtn.classList.toggle(
        "selected",place === "concepcion"
    );

    bigajoBtn.classList.toggle(
        "selected",place === "bigajo"
    );

    document.getElementById("selectedBarangay").innerText =
        place === "concepcion"
        ? "✅ Selected: BRGY. CONCEPCION"
        : "✅ Selected: BRGY. BIGAJO";

    startCountdown();

}

/* START COUNTDOWN */
function startCountdown(){

    if(countdownStarted) return;

    countdownStarted = true;

    concepcionBtn.disabled = true;
    bigajoBtn.disabled = true;

    txt.innerText = "Preparing your internet access...";

    let msgIndex = 0;

    msgTimer = setInterval(()=>{

        if(t > 0){
            txt.innerText = msgs[msgIndex];
            msgIndex = (msgIndex + 1) % msgs.length;
        }

    },2000);

    timer = setInterval(()=>{

        t--;

        bar.style.width = ((10-t)*10)+"%";

        if(t <= 0){

            clearInterval(timer);
            clearInterval(msgTimer);

            txt.innerText = "✅ Ready! Tap CONNECT to continue.";

            btn.disabled = false;
            btn.innerText = "🚀 CONNECT INTERNET";

        }

    },1000);

}

/* DATE AND TIME */
function updateDateTime(){

    const d = new Date();

    document.getElementById("dateTime").innerHTML =
        "📅 " + d.toLocaleDateString() +
        "<br>🕒 " + d.toLocaleTimeString();

}

updateDateTime();
setInterval(updateDateTime,1000);

/* MUSIC */
document.body.addEventListener("click",()=>{

    const music = document.getElementById("bgmusic");

    music.volume = 0.2;

    music.play().catch(()=>{});

},{once:true});

/* CONNECT */
function connectNet(){

    if(!selected){
        alert("Please select your barangay first.");
        return;
    }

    if(t > 0) return;

    btn.innerText = "CONNECTING...";
    btn.disabled = true;

    const sound = document.getElementById("clickSound");

    sound.play().catch(()=>{});

    txt.innerText = "🚀 Connecting to " +
        (selected === "concepcion"
        ? "BRGY. CONCEPCION"
        : "BRGY. BIGAJO") + "...";

    setTimeout(()=>{

        window.location.href = portals[selected];

    },1500);

}

</script>

</body>
</html>
